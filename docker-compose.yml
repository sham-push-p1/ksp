version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-ksp_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ksp_crime_intel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ksp_admin} -d ${DB_NAME:-ksp_crime_intel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ksp_admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-ksp_crime_intel}
      - PORT=3001
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-https://ksp-intel.karnataka.gov.in}
      # Ollama: connects to host machine's Ollama instance
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Gemini API Key (if provided in local .env)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_PORT=80
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
